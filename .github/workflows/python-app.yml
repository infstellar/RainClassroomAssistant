name: Python application

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  validate-release:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout tagged commit and main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: version
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH, for example v0.4.3")
          subprocess.run(
              ["git", "merge-base", "--is-ancestor", "HEAD", "origin/main"],
              check=True,
          )
          source = Path("file_version_info.txt").read_text(encoding="utf-8")
          match = re.search(r"u'FileVersion', u'([^']+)'", source)
          if not match or tag != f"v{match.group(1)}":
              raise SystemExit("Release tag must match FileVersion in file_version_info.txt")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={tag}\n")

  pyinstaller-build:
    needs: [validate-release]
    runs-on: windows-latest
    outputs:
      executable_path: ./dist/RainClassroomAssistant.exe
    steps:
    - name: PyInstaller Action
      uses: sayyid5416/pyinstaller@v1.6.1
      with:
        python_ver: '3.10'
        spec: 'RainClassroomAssistant.spec'
        requirements: 'requirements.txt'
    - name: Upload Executable
      uses: actions/upload-artifact@v4.4.0
      with:
        name: RainClassroomAssistant
        path: ./dist/RainClassroomAssistant.exe

  pyinstaller-build-ios:
    runs-on: macos-latest
    if: false
    steps:
    - name: PyInstaller Action
      uses: sayyid5416/pyinstaller@v1.6.1
      with:
        python_ver: '3.10'
        spec: 'RainClassroomAssistant.spec'
        requirements: 'requirements.txt'
    - name: Upload Executable
      uses: actions/upload-artifact@v4.4.0
      with:
        name: RainClassroomAssistant
        path: ./dist/RainClassroomAssistant

  release:
    runs-on: ubuntu-latest
    needs: [validate-release, pyinstaller-build]
    env:
      RELEASE_TAG: ${{ needs.validate-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Write release version
        run: |
          printf '%s\n' "$RELEASE_TAG" > version.txt
      - name: download executable
        uses: actions/download-artifact@v4.1.8
        with:
          name: RainClassroomAssistant
          path: ./dist
      - name: calculate hash for Windows executable
        id: hash_windows
        run: |
          hash=$(sha256sum ./dist/RainClassroomAssistant.exe | cut -d ' ' -f 1)
          echo "hash_windows=$hash" >> "$GITHUB_OUTPUT"
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/RainClassroomAssistant.exe
            version.txt
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            ## hash256
            - RainClassroomAssistant.exe: ${{ steps.hash_windows.outputs.hash_windows }}
          draft: false
          prerelease: false
