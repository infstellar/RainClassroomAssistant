name: Bug 反馈
description: Bug 反馈
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 在提问之前...
      description: |
        请确认自己完成了要求之后再进行勾选
      options:
        - label: 我理解 Issue 是用于反馈和解决问题的，而非吐槽评论区，将尽可能提供更多信息帮助问题解决
          required: true
        - label: 我填写了简短且清晰明确的标题，以便开发者在翻阅 Issue 列表时能快速确定大致问题。而不是“一个建议”、“卡住了”等
          required: true
        - label: 我使用的是当前更新版本的最新版，且已查看版本发布至今和 Pull Requests 中尚未发布的更新内容，并未提及该 Bug 已被修复的情况
          required: true
        - label: 我已检查了置顶议题（Pinned Issue）（公告）、活跃议题（Open Issue）、已关闭议题（Closed Issue），确认我的问题未被提及
          required: true
  - type: textarea
    id: describe
    attributes:
      label: 问题描述
      description: 描述问题时请尽可能详细
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Classification
      description: >-
        雨课堂类型（如：荷塘雨课堂）
      options:
        - 雨课堂
        - 荷塘雨课堂
        - 长江雨课堂
        - 黄河雨课堂
    validations:
      required: true
  - type: textarea
    id: versin
    attributes:
      label: Version
      description: |
        请提供左侧桌面服务卡片显示的版本号、Windows 版本，以及安装版或便携版
      placeholder: 例如 0.5.0 / Windows 11 / 安装版
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: |
        可上传屏幕截图或录制以帮助解释你的问题
        注意保护个人隐私信息
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 运行日志
      description: 从“运行日志”页面复制相关内容，或通过“打开日志目录”找到 JSONL 文件。分享前移除个人信息、会话和密钥。
      render: text
    validations:
      required: false
  - type: textarea
    id: others
    attributes:
      label: 还有别的吗？
      description: |
        任何能让我们对你所遇到的问题有更多了解的东西
    validations:
      required: false
